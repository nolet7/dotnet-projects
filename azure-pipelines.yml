# This pipeline deploys the static website to Azure Storage.
# It is used because Azure App Service Plan creation is currently blocked by quota.

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Azure subscription ID for novacorp-sandbox-eus.
  azureSubscriptionId: '684d28f9-99f5-4a5d-8379-94c88f135139'

  # Azure resource group that contains the storage account.
  resourceGroupName: 'rg-dotnet-webui-sandbox-eastus2-001'

  # Azure Storage Account hosting the static website.
  storageAccountName: 'stdotwebui23808'

  # Folder in the repo containing files to publish.
  staticSitePath: 'static-site'

steps:
# Checkout the GitHub repository.
- checkout: self

# Deploy static website files to the Azure Storage $web container.
# The service connection must be created in Azure DevOps.
- task: AzureCLI@2
  displayName: 'Deploy static website to Azure Storage'
  inputs:
    azureSubscription: 'sc-azure-dotnet-storage-sandbox'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e

      echo "Setting Azure subscription..."
      az account set --subscription "$(azureSubscriptionId)"

      echo "Getting storage account key..."
      ACCOUNT_KEY=$(az storage account keys list \
        --resource-group "$(resourceGroupName)" \
        --account-name "$(storageAccountName)" \
        --query "[0].value" \
        --output tsv)

      echo "Enabling static website hosting..."
      az storage blob service-properties update \
        --account-name "$(storageAccountName)" \
        --account-key "$ACCOUNT_KEY" \
        --static-website true \
        --index-document index.html \
        --404-document 404.html

      echo "Uploading static website files..."
      az storage blob upload-batch \
        --account-name "$(storageAccountName)" \
        --account-key "$ACCOUNT_KEY" \
        --destination '$web' \
        --source "$(staticSitePath)" \
        --overwrite true

      echo "Deployment complete. Website URL:"
      az storage account show \
        --resource-group "$(resourceGroupName)" \
        --name "$(storageAccountName)" \
        --query "primaryEndpoints.web" \
        --output tsv
