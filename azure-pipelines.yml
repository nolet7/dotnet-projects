# This pipeline runs automatically when code is pushed to the main branch.
trigger:
- main

# This tells Azure DevOps to use a Microsoft-hosted Ubuntu build agent.
# The agent is a temporary machine that builds, packages, and deploys the app.
pool:
  vmImage: 'ubuntu-latest'

# Variables make the pipeline easier to update without editing every task.
variables:
  # Build configuration for production-style deployment.
  buildConfiguration: 'Release'

  # Azure App Service name.
  # Replace this after you create the Web App in Azure.
  # Example: app-dotnet-webui-dev-nolet7-001
  appName: 'REPLACE_WITH_YOUR_AZURE_APP_SERVICE_NAME'

  # Azure DevOps service connection name.
  # Create this in Azure DevOps Project Settings > Service connections.
  # Recommended name: sc-azure-dotnet-webui-dev
  azureSubscription: 'REPLACE_WITH_YOUR_AZURE_SERVICE_CONNECTION_NAME'

  # Path to the .NET web project that should be built and deployed.
  projectPath: 'DotNetAzureWebUi.Web/DotNetAzureWebUi.Web.csproj'

# Pipeline steps start here.
steps:

# Install the .NET SDK on the Microsoft-hosted build agent.
# This project targets net10.0, so the pipeline uses 10.x.
# If you later change the project to net8.0, change this to 8.x.
- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'

# Print SDK information for troubleshooting pipeline failures.
- script: |
    dotnet --info
  displayName: 'Show .NET SDK information'

# Restore NuGet dependencies for the project.
- task: DotNetCoreCLI@2
  displayName: 'Restore dependencies'
  inputs:
    command: 'restore'
    projects: '$(projectPath)'

# Build the application in Release mode.
# --no-restore is used because the restore step already ran.
- task: DotNetCoreCLI@2
  displayName: 'Build application'
  inputs:
    command: 'build'
    projects: '$(projectPath)'
    arguments: '--configuration $(buildConfiguration) --no-restore'

# Publish the application into a deployable output folder.
# zipAfterPublish creates a .zip package for Azure App Service deployment.
- task: DotNetCoreCLI@2
  displayName: 'Publish application'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: '$(projectPath)'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish'
    zipAfterPublish: true

# Deploy the published .zip package to Azure App Service.
# appType webAppLinux must match the Linux App Service created in Azure.
- task: AzureWebApp@1
  displayName: 'Deploy to Azure App Service'
  inputs:
    azureSubscription: '$(azureSubscription)'
    appType: 'webAppLinux'
    appName: '$(appName)'
    package: '$(Build.ArtifactStagingDirectory)/publish/*.zip'
